name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "public/b50-pocket/**"
      - "app/api/result-import/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk B50-Pocket-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: B50-Pocket-debug
          path: B50-Pocket-debug.apk
          if-no-files-found: error

      - name: Publish latest test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view b50-pocket-android-test >/dev/null 2>&1; then
            gh release upload b50-pocket-android-test B50-Pocket-debug.apk --clobber
          else
            gh release create b50-pocket-android-test B50-Pocket-debug.apk \
              --title "B50 Pocket Android Test" \
              --notes "Latest test build. Web UI and logic update automatically; reinstall only when the native Android shell changes."
          fi
